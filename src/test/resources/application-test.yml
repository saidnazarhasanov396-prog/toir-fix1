spring:
  datasource:
    url: jdbc:h2:mem:toir_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE,MONTH,YEAR;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      connection-timeout: 3000

  flyway:
    enabled: false

  sql:
    init:
      mode: never

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  test:
    database:
      replace: none

minio:
  endpoint: http://minio.test:9000
  access-key: test-access
  secret-key: test-secret
  bucket-name: test-bucket
  public-url:

app:
  firebase:
    enabled: false
