server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/toir_demo
    username: postgres
    password: root123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

springdoc:
  cache:
    disabled: true
  api-docs:
    path: /api/v1/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      # Local/dev/demo only. Production must use TOIR_JWT_SECRET from the environment or secret manager.
      secret: test-only-local-demo-jwt-secret-minimum-32-bytes
      expiration-minutes: 720
      issuer: toir-backend
  jackson:
    instant-default-zone: Asia/Tashkent
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
      - http://localhost:5173
      - http://127.0.0.1:3000
      - http://127.0.0.1:5173
  files:
    storage-path: ./uploads
  openapi:
    dev-url: http://localhost:8080
    prod-url: https://api-toir.tenzorsoft.uz
  bootstrap:
    create-default-admin: true
    admin-username: admin
    admin-password: Root123456
    admin-email: admin@toir.local
    admin-full-name: System Administrator
  firebase:
    enabled: ${APP_FIREBASE_ENABLED:false}
    project-id: ${APP_FIREBASE_PROJECT_ID:toir-51480}
    service-account-file: ${APP_FIREBASE_SERVICE_ACCOUNT_FILE:.secrets/firebase-service-account.json}
    service-account-json: ${APP_FIREBASE_SERVICE_ACCOUNT_JSON:}
    service-account-base64: ${APP_FIREBASE_SERVICE_ACCOUNT_BASE64:}

logging:
  level:
    root: INFO
    com.toir: INFO
