server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/toir_demo
    username: postgres
    password: root123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

springdoc:
  cache:
    disabled: true
  api-docs:
    path: /api/v1/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    app:
      debug-errors:
        enabled: true
      dashboard-detail:
        canonical-site-id: ...

app:
  dashboard-detail:
    canonical-site-id: ${DASHBOARD_CANONICAL_SITE_ID:10000000-0000-0000-0000-000000000001}
  security:
    jwt:
      # Local/dev/demo only. Production must use TOIR_JWT_SECRET from the environment or secret manager.
      secret: test-only-local-demo-jwt-secret-minimum-32-bytes
      expiration-minutes: 720
      issuer: toir-backend
  jackson:
    instant-default-zone: Asia/Tashkent
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
      - http://localhost:5173
      - http://127.0.0.1:3000
      - http://127.0.0.1:5173
  files:
    storage-path: ./uploads
  openapi:
    dev-url: http://localhost:8080
    prod-url: https://api-toir.tenzorsoft.uz
  bootstrap:
    create-default-admin: true
    admin-username: admin
    admin-password: Root123456
    admin-email: admin@toir.local
    admin-full-name: System Administrator

  logging:
    level:
      com.toir: DEBUG
      com.google.firebase: DEBUG

logging:
  level:
    root: INFO
    com.toir: INFO
toir:
  ai:
    gateway:
      enabled: true
