server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/toir_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2702}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-at-least-32-bytes}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
      issuer: toir-backend
  files:
    storage-path: ${FILE_STORAGE_PATH:./uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.toir: INFO
