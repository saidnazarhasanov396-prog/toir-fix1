server:
  port: 8080
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://192.168.1.7:5432/toirdb
    username: toir-user
    password: 5oe1z42pNm0D1ohP13Z1
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

springdoc:
  cache:
    disabled: true
  api-docs:
    path: /api/v1/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: qPLc6N8MrrcHSK9kg28L2sR1axfEOSvR390ssog7BTS
      expiration-minutes: 720
      issuer: toir-backend
  jackson:
    instant-default-zone: Asia/Tashkent
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
      - http://localhost:8080
      - http://localhost:5173
      - https://toir.tenzorsoft.uz
      - https://api-toir.tenzorsoft.uz
  files:
    storage-path: ./uploads
  openapi:
    dev-url: http://localhost:8080
    prod-url: https://api-toir.tenzorsoft.uz
  bootstrap:
    create-default-admin: true
    admin-username: admin
    admin-password: Root123456
    admin-email: admin@toir.local
    admin-full-name: System Administrator
  firebase:
    enabled: ${APP_FIREBASE_ENABLED:true}
    project-id: ${APP_FIREBASE_PROJECT_ID:toir-51480}
    service-account-file: ${APP_FIREBASE_SERVICE_ACCOUNT_FILE:classpath:firebase-service-account.json}
    service-account-json: ${APP_FIREBASE_SERVICE_ACCOUNT_JSON:}
    service-account-base64: ${APP_FIREBASE_SERVICE_ACCOUNT_BASE64:}

logging:
  level:
    root: INFO
    com.toir: INFO
    com.google.firebase: WARN

toir:
  features:
    annual-maintenance-approval-first:
      enabled: ${TOIR_FEATURES_ANNUAL_MAINTENANCE_APPROVAL_FIRST_ENABLED:true}
  ppr-lifecycle:
    planning-sessions-enabled: ${TOIR_PPR_LIFECYCLE_PLANNING_SESSIONS_ENABLED:true}
    due-work-order-generation-enabled: ${TOIR_PPR_LIFECYCLE_DUE_WORK_ORDER_GENERATION_ENABLED:false}
    strict-closure-enabled: ${TOIR_PPR_LIFECYCLE_STRICT_CLOSURE_ENABLED:true}
    work-order-generation:
      cron: ${TOIR_PPR_LIFECYCLE_WORK_ORDER_GENERATION_CRON:0 10 * * * *}
      timezone: ${TOIR_PPR_LIFECYCLE_WORK_ORDER_GENERATION_TIMEZONE:Asia/Tashkent}
      batch-size: ${TOIR_PPR_LIFECYCLE_WORK_ORDER_GENERATION_BATCH_SIZE:100}
      actor-id: ${TOIR_PPR_LIFECYCLE_WORK_ORDER_GENERATION_ACTOR_ID:}
