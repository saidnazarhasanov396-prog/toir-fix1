server:
  port: 8080
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://192.168.1.7:5432/toirdb
    username: toir-user
    password: 5oe1z42pNm0D1ohP13Z1
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

springdoc:
  api-docs:
    path: /api/v1/v3/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html

app:
  security:
    jwt:
      secret: change-me-in-production-use-a-long-random-secret-at-least-32-bytes
      expiration-minutes: 720
      issuer: toir-backend
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
      - http://localhost:8080
      - http://localhost:5173
      - https://toir.tenzorsoft.uz
      - https://api-toir.tenzorsoft.uz
  files:
    storage-path: ./uploads
  bootstrap:
    create-default-admin: true
    admin-username: admin
    admin-password: Root123456
    admin-email: admin@toir.local
    admin-full-name: System Administrator
    seed-demo-data: false

logging:
  level:
    root: INFO
    com.toir: INFO
