server:
  port: 8080
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${TOIR_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.1.7:5432/toirdb}}
    username: ${TOIR_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:toir-user}}
    password: ${TOIR_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:5oe1z42pNm0D1ohP13Z1}}
    driver-class-name: org.postgresql.Driver
  flyway:
    user: ${TOIR_FLYWAY_USER:${SPRING_FLYWAY_USER:${TOIR_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:toir-user}}}}
    password: ${TOIR_FLYWAY_PASSWORD:${SPRING_FLYWAY_PASSWORD:${TOIR_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:5oe1z42pNm0D1ohP13Z1}}}}
    default-schema: ${TOIR_DB_SCHEMA:${SPRING_FLYWAY_DEFAULT_SCHEMA:public}}
    schemas: ${TOIR_DB_SCHEMA:${SPRING_FLYWAY_SCHEMAS:${SPRING_FLYWAY_DEFAULT_SCHEMA:public}}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

springdoc:
  cache:
    disabled: true
  api-docs:
    path: /api/v1/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: change-me-in-production-use-a-long-random-secret-at-least-32-bytes
      expiration-minutes: 720
      issuer: toir-backend
  jackson:
    instant-default-zone: Asia/Tashkent
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
      - http://localhost:8080
      - http://localhost:5173
      - https://toir.tenzorsoft.uz
      - https://api-toir.tenzorsoft.uz
  files:
    storage-path: ./uploads
  openapi:
    dev-url: http://localhost:8080
    prod-url: https://api-toir.tenzorsoft.uz
  bootstrap:
    create-default-admin: true
    admin-username: admin
    admin-password: Root123456
    admin-email: admin@toir.local
    admin-full-name: System Administrator

logging:
  level:
    root: INFO
    com.toir: INFO
