spring:
  application:
    name: toir-backend
  profiles:
    default: prod
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

springdoc:
  cache:
    disabled: true

app:
  integrations:
    faktura-uz:
      endpoints:
        auth: https://account.faktura.uz/token
        get-documents: https://api.faktura.uz/Api/Document/GetDocuments
        get-documents-content: https://api.faktura.uz/Api/Document/GetDocumentsContent
        get-user-details: https://api.faktura.uz/Api/account/getuserdetails
  features:
    manual-attributes:
      write-enabled: ${APP_FEATURES_MANUAL_ATTRIBUTES_WRITE_ENABLED:false}
  firebase:
    enabled: true

minio:
  endpoint: https://s3.tenzorsoft.uz
  access-key: s3_tenzorsoft_minio_user
  secret-key: b7Qbuf8DpyAdZmlok2X3PSlD6n9jilSuhctZRd2b
  bucket-name: s3-toir
