spring:
  application:
    name: toir-backend
  profiles:
    default: prod
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

springdoc:
  cache:
    disabled: true

app:
  integrations:
    erp:
      enabled: ${ERP_INTEGRATION_ENABLED:false}
      base-url: ${ERP_INTEGRATION_BASE_URL:}
      bearer-token: ${ERP_INTEGRATION_BEARER_TOKEN:}
      allowed-hosts: ${ERP_INTEGRATION_ALLOWED_HOSTS:}
      outbox-dispatch-delay-ms: ${ERP_INTEGRATION_OUTBOX_DISPATCH_DELAY_MS:15000}
    atil:
      enabled: ${ATIL_INTEGRATION_ENABLED:false}
      base-url: ${ATIL_INTEGRATION_BASE_URL:}
      bearer-token: ${ATIL_INTEGRATION_BEARER_TOKEN:}
      allowed-hosts: ${ATIL_INTEGRATION_ALLOWED_HOSTS:}
      outbox-dispatch-delay-ms: ${ATIL_INTEGRATION_OUTBOX_DISPATCH_DELAY_MS:15000}
    faktura-uz:
      endpoints:
        auth: https://account.faktura.uz/token
        get-documents: https://api.faktura.uz/Api/Document/GetDocuments
        get-documents-content: https://api.faktura.uz/Api/Document/GetDocumentsContent
        get-user-details: https://api.faktura.uz/Api/account/getuserdetails
  features:
    manual-attributes:
      write-enabled: ${APP_FEATURES_MANUAL_ATTRIBUTES_WRITE_ENABLED:false}
  firebase:
    enabled: ${APP_FIREBASE_ENABLED:true}
    project-id: ${APP_FIREBASE_PROJECT_ID:toir-51480}
    service-account-file: ${APP_FIREBASE_SERVICE_ACCOUNT_FILE:classpath:firebase-service-account.json}
    service-account-json: ${APP_FIREBASE_SERVICE_ACCOUNT_JSON:}
    service-account-base64: ${APP_FIREBASE_SERVICE_ACCOUNT_BASE64:}

toir:
  telemetry:
    simulator:
      enabled: ${TOIR_TELEMETRY_ENABLED:false}
      ws-url: ${TOIR_TELEMETRY_WS_URL:}
      reconnect-initial: ${TOIR_TELEMETRY_RECONNECT_INITIAL:PT1S}
      reconnect-max: ${TOIR_TELEMETRY_RECONNECT_MAX:PT30S}
  features:
    annual-maintenance-approval-first:
      enabled: ${TOIR_FEATURES_ANNUAL_MAINTENANCE_APPROVAL_FIRST_ENABLED:false}
  ppr-lifecycle:
    planning-sessions-enabled: ${TOIR_PPR_LIFECYCLE_PLANNING_SESSIONS_ENABLED:false}
    due-work-order-generation-enabled: ${TOIR_PPR_LIFECYCLE_DUE_WORK_ORDER_GENERATION_ENABLED:false}
    strict-closure-enabled: ${TOIR_PPR_LIFECYCLE_STRICT_CLOSURE_ENABLED:false}
    work-order-generation:
      cron: ${TOIR_PPR_LIFECYCLE_WORK_ORDER_GENERATION_CRON:0 10 * * * *}
      timezone: ${TOIR_PPR_LIFECYCLE_WORK_ORDER_GENERATION_TIMEZONE:Asia/Tashkent}
      batch-size: ${TOIR_PPR_LIFECYCLE_WORK_ORDER_GENERATION_BATCH_SIZE:100}
      actor-id: ${TOIR_PPR_LIFECYCLE_WORK_ORDER_GENERATION_ACTOR_ID:}
  ai:
    gateway:
      enabled: ${TOIR_AI_GATEWAY_ENABLED:false}
      base-url: ${TOIR_AI_GATEWAY_BASE_URL:https://toir-ai.tenzorsoft.uz}
      auth-username: ${TOIR_AI_GATEWAY_AUTH_USERNAME:}
      auth-password: ${TOIR_AI_GATEWAY_AUTH_PASSWORD:}
      token-path: ${TOIR_AI_GATEWAY_TOKEN_PATH:/auth/token}
      token-refresh-skew: ${TOIR_AI_GATEWAY_TOKEN_REFRESH_SKEW:30s}
      authentication-header: ${TOIR_AI_GATEWAY_AUTH_HEADER:}
      authentication-secret: ${TOIR_AI_GATEWAY_AUTH_SECRET:}
      connect-timeout: ${TOIR_AI_GATEWAY_CONNECT_TIMEOUT:5s}
      read-timeout: ${TOIR_AI_GATEWAY_READ_TIMEOUT:120s}
      max-upload-bytes: ${TOIR_AI_GATEWAY_MAX_UPLOAD_BYTES:52428800}
    maintenance-action-semantic-search:
      # Durable enqueue/backfill can be enabled independently; worker/search remain blocked by the vector schema.
      enabled: ${TOIR_MAINTENANCE_ACTION_SEMANTIC_SEARCH_ENABLED:false}
      generation-worker-enabled: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_WORKER_ENABLED:false}
      semantic-search-enabled: ${TOIR_MAINTENANCE_ACTION_SEMANTIC_SEARCH_API_ENABLED:false}
      backfill-enabled: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_BACKFILL_ENABLED:false}
      ai-service-contract-confirmed: ${TOIR_MAINTENANCE_ACTION_AI_CONTRACT_CONFIRMED:false}
      model-dimension-contract-confirmed: ${TOIR_MAINTENANCE_ACTION_MODEL_DIMENSION_CONFIRMED:false}
      pgvector-prerequisite-confirmed: ${TOIR_MAINTENANCE_ACTION_PGVECTOR_CONFIRMED:false}
      service-base-url: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_BASE_URL:}
      endpoint-path: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_ENDPOINT_PATH:}
      authentication-header: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_AUTH_HEADER:}
      authentication-secret: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_AUTH_SECRET:}
      model-name: ibm-granite/granite-embedding-311m-multilingual-r2
      model-revision: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_MODEL_REVISION:}
      dimension: 768
      document-mode: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_DOCUMENT_MODE:}
      query-mode: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_QUERY_MODE:}
      connect-timeout: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_CONNECT_TIMEOUT:}
      read-timeout: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_READ_TIMEOUT:}
      client-concurrency: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_CLIENT_CONCURRENCY:0}
      # Keep at one until the AI team explicitly confirms response ordering for batches.
      batch-size: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_BATCH_SIZE:1}
      polling-interval: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_POLLING_INTERVAL:}
      lease-duration: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_LEASE_DURATION:}
      retry-count: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_RETRY_COUNT:0}
      retry-base-backoff: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_RETRY_BASE_BACKOFF:}
      retry-max-backoff: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_RETRY_MAX_BACKOFF:}
      retry-jitter: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_RETRY_JITTER:0}
      stale-retention: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_STALE_RETENTION:}
      failed-retention: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_FAILED_RETENTION:}
      input-limits:
        name-characters: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_NAME_CHARACTERS:0}
        category-characters: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_CATEGORY_CHARACTERS:0}
        required-skill-characters: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_REQUIRED_SKILL_CHARACTERS:0}
        safety-notes-characters: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_SAFETY_NOTES_CHARACTERS:0}
        tools-required-characters: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_TOOLS_REQUIRED_CHARACTERS:0}
        spare-parts-required-characters: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_SPARE_PARTS_REQUIRED_CHARACTERS:0}
        consumables-required-characters: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_CONSUMABLES_REQUIRED_CHARACTERS:0}
        composed-characters: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_COMPOSED_CHARACTERS:0}
        composed-utf8-bytes: ${TOIR_MAINTENANCE_ACTION_EMBEDDING_COMPOSED_UTF8_BYTES:0}
      backfill:
        minimum-batch-size: ${TOIR_MAINTENANCE_ACTION_BACKFILL_MIN_BATCH_SIZE:0}
        default-batch-size: ${TOIR_MAINTENANCE_ACTION_BACKFILL_DEFAULT_BATCH_SIZE:0}
        maximum-batch-size: ${TOIR_MAINTENANCE_ACTION_BACKFILL_MAX_BATCH_SIZE:0}
    equipment-lifecycle:
      export:
        enabled: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_ENABLED:true}
        maximum-equipment: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_MAXIMUM_EQUIPMENT:10000}
        selection-batch-size: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_SELECTION_BATCH_SIZE:250}
        checkpoint-records: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_CHECKPOINT_RECORDS:25}
        maximum-part-bytes: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_MAXIMUM_PART_BYTES:16777216}
        worker-concurrency: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_WORKER_CONCURRENCY:1}
        worker-queue-capacity: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_WORKER_QUEUE_CAPACITY:2}
        lease-duration: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_LEASE_DURATION:PT5M}
        completed-retention: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_COMPLETED_RETENTION:P7D}
        staging-retention: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_STAGING_RETENTION:P1D}
        retention-cleanup-batch-size: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_RETENTION_BATCH_SIZE:20}
        storage-list-batch-size: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_STORAGE_LIST_BATCH_SIZE:200}
        multipart-part-size-bytes: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_MULTIPART_PART_SIZE_BYTES:10485760}
        allowed-profiles:
          - standard-v1
        standard-profile:
          history-lookback: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_HISTORY_LOOKBACK:P1825D}
          future-planning-horizon: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_FUTURE_HORIZON:P365D}
          section-limit: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_SECTION_LIMIT:500}
        s3:
          endpoint: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_S3_ENDPOINT:https://s3.tenzorsoft.uz}
          bucket: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_S3_BUCKET:s3-toir}
          prefix: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_S3_PREFIX:equipment-lifecycle-exports/test/}
          access-key: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_S3_ACCESS_KEY:s3_tenzorsoft_minio_user}
          secret-key: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_S3_SECRET_KEY:b7Qbuf8DpyAdZmlok2X3PSlD6n9jilSuhctZRd2b}
          region: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_S3_REGION:}
          tls-trust-store: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_S3_TLS_TRUST_STORE:}
          tls-trust-store-password: ${TOIR_EQUIPMENT_LIFECYCLE_EXPORT_S3_TLS_TRUST_STORE_PASSWORD:}

minio:
  endpoint: https://s3.tenzorsoft.uz
  access-key: s3_tenzorsoft_minio_user
  secret-key: b7Qbuf8DpyAdZmlok2X3PSlD6n9jilSuhctZRd2b
  bucket-name: s3-toir
  public-url: https://s3.tenzorsoft.uz
