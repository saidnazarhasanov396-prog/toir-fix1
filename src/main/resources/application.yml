spring:
  application:
    name: toir-backend
  profiles:
    default: prod
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

springdoc:
  cache:
    disabled: true

app:
  integrations:
    erp:
      enabled: ${ERP_INTEGRATION_ENABLED:false}
      base-url: ${ERP_INTEGRATION_BASE_URL:}
      bearer-token: ${ERP_INTEGRATION_BEARER_TOKEN:}
      allowed-hosts: ${ERP_INTEGRATION_ALLOWED_HOSTS:}
      outbox-dispatch-delay-ms: ${ERP_INTEGRATION_OUTBOX_DISPATCH_DELAY_MS:15000}
    atil:
      enabled: ${ATIL_INTEGRATION_ENABLED:false}
      base-url: ${ATIL_INTEGRATION_BASE_URL:}
      bearer-token: ${ATIL_INTEGRATION_BEARER_TOKEN:}
      allowed-hosts: ${ATIL_INTEGRATION_ALLOWED_HOSTS:}
      outbox-dispatch-delay-ms: ${ATIL_INTEGRATION_OUTBOX_DISPATCH_DELAY_MS:15000}
    faktura-uz:
      endpoints:
        auth: https://account.faktura.uz/token
        get-documents: https://api.faktura.uz/Api/Document/GetDocuments
        get-documents-content: https://api.faktura.uz/Api/Document/GetDocumentsContent
        get-user-details: https://api.faktura.uz/Api/account/getuserdetails
  features:
    manual-attributes:
      write-enabled: ${APP_FEATURES_MANUAL_ATTRIBUTES_WRITE_ENABLED:false}
  firebase:
    enabled: ${APP_FIREBASE_ENABLED:true}
    project-id: ${APP_FIREBASE_PROJECT_ID:toir-51480}
    service-account-file: ${APP_FIREBASE_SERVICE_ACCOUNT_FILE:classpath:firebase-service-account.json}
    service-account-json: ${APP_FIREBASE_SERVICE_ACCOUNT_JSON:}
    service-account-base64: ${APP_FIREBASE_SERVICE_ACCOUNT_BASE64:}

toir:
  features:
    annual-maintenance-approval-first:
      enabled: ${TOIR_FEATURES_ANNUAL_MAINTENANCE_APPROVAL_FIRST_ENABLED:false}
  ppr-lifecycle:
    planning-sessions-enabled: ${TOIR_PPR_LIFECYCLE_PLANNING_SESSIONS_ENABLED:false}
    due-work-order-generation-enabled: ${TOIR_PPR_LIFECYCLE_DUE_WORK_ORDER_GENERATION_ENABLED:false}
    strict-closure-enabled: ${TOIR_PPR_LIFECYCLE_STRICT_CLOSURE_ENABLED:false}
    work-order-generation:
      cron: ${TOIR_PPR_LIFECYCLE_WORK_ORDER_GENERATION_CRON:0 10 * * * *}
      timezone: ${TOIR_PPR_LIFECYCLE_WORK_ORDER_GENERATION_TIMEZONE:Asia/Tashkent}
      batch-size: ${TOIR_PPR_LIFECYCLE_WORK_ORDER_GENERATION_BATCH_SIZE:100}
      actor-id: ${TOIR_PPR_LIFECYCLE_WORK_ORDER_GENERATION_ACTOR_ID:}

minio:
  endpoint: https://s3.tenzorsoft.uz
  access-key: s3_tenzorsoft_minio_user
  secret-key: b7Qbuf8DpyAdZmlok2X3PSlD6n9jilSuhctZRd2b
  bucket-name: s3-toir
