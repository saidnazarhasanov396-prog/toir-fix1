services:
  postgres:
    image: postgres:16-alpine
    container_name: toir-postgres
    environment:
      POSTGRES_DB: toir_demo
      POSTGRES_USER: toir
      POSTGRES_PASSWORD: toir
    ports:
      - "5432:5432"
    volumes:
      - toir_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toir -d toir_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: toir-backend-java
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev,demo-seed
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/toir_demo
      SPRING_DATASOURCE_USERNAME: toir
      SPRING_DATASOURCE_PASSWORD: toir
      FILE_STORAGE_PATH: /app/uploads
      APP_FIREBASE_ENABLED: "true"
      APP_FIREBASE_PROJECT_ID: toir-51480
      APP_FIREBASE_SERVICE_ACCOUNT_FILE: /run/secrets/firebase-service-account.json
    ports:
      - "8080:8080"
    volumes:
      - toir_uploads:/app/uploads
      - ./.secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro

volumes:
  toir_pgdata:
  toir_uploads:
