workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

variables:
  CHART_VERSION: 10.2-full
  CI_DEBUG_TRACE: "false"
  SERVICE_NAME: toir-backend
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: "${CI_PROJECT_NAME}-maven"
  paths:
    - .m2/repository
  policy: pull-push

stages:
  - compile
  - build
  - deploy

compile:
  image: maven:3.9.9-eclipse-temurin-21
  stage: compile
  script:
    - echo "Using cached Maven repository..."
    - mvn dependency:go-offline --no-transfer-progress
    - mvn clean package -DskipTests --no-transfer-progress
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 days

build:
  stage: build
  image: docker:24.0.9
  services:
    - docker:24.0.9-dind
  script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - docker build -t "${CI_REGISTRY_IMAGE}:latest" .
    - docker push "${CI_REGISTRY_IMAGE}:latest"


deploy:
  stage: deploy
  image: alpine:latest
  script:
    - chmod og= $SSH_PRIVATE_KEY
    - apk update && apk add openssh-client
    - |
      APP_FIREBASE_EFFECTIVE_ENABLED="${APP_FIREBASE_ENABLED:-true}"
      APP_FIREBASE_EFFECTIVE_PROJECT_ID="${APP_FIREBASE_PROJECT_ID:-toir-51480}"
      APP_FIREBASE_EFFECTIVE_SERVICE_ACCOUNT_BASE64="${APP_FIREBASE_SERVICE_ACCOUNT_BASE64:-}"
      FIREBASE_CREDENTIALS_PRESENT=false
      if [ -n "${APP_FIREBASE_SERVICE_ACCOUNT_BASE64:-}" ] || [ -n "${APP_FIREBASE_SERVICE_ACCOUNT_JSON:-}" ] || [ -n "${APP_FIREBASE_SERVICE_ACCOUNT_FILE:-}" ]; then
        FIREBASE_CREDENTIALS_PRESENT=true
      fi
      if [ -z "$APP_FIREBASE_EFFECTIVE_SERVICE_ACCOUNT_BASE64" ] && [ -n "${APP_FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
        APP_FIREBASE_EFFECTIVE_SERVICE_ACCOUNT_BASE64="$(printf '%s' "$APP_FIREBASE_SERVICE_ACCOUNT_JSON" | base64 | tr -d '\n')"
      fi
      if [ -z "$APP_FIREBASE_EFFECTIVE_SERVICE_ACCOUNT_BASE64" ] && [ -n "${APP_FIREBASE_SERVICE_ACCOUNT_FILE:-}" ]; then
        if [ ! -r "$APP_FIREBASE_SERVICE_ACCOUNT_FILE" ]; then
          echo "APP_FIREBASE_SERVICE_ACCOUNT_FILE is not readable in the GitLab runner"
          exit 1
        fi
        APP_FIREBASE_EFFECTIVE_SERVICE_ACCOUNT_BASE64="$(base64 < "$APP_FIREBASE_SERVICE_ACCOUNT_FILE" | tr -d '\n')"
      fi
      if [ -z "${APP_FIREBASE_ENABLED:-}" ] && [ "$FIREBASE_CREDENTIALS_PRESENT" = "true" ]; then
        APP_FIREBASE_EFFECTIVE_ENABLED=true
      fi
      if [ "${APP_FIREBASE_EFFECTIVE_ENABLED}" = "true" ]; then
        if [ -z "${APP_FIREBASE_EFFECTIVE_PROJECT_ID:-}" ]; then
          echo "Missing APP_FIREBASE_PROJECT_ID while APP_FIREBASE_ENABLED=true"
          exit 1
        fi
        if [ "$FIREBASE_CREDENTIALS_PRESENT" != "true" ]; then
          echo "Missing Firebase credentials: set APP_FIREBASE_SERVICE_ACCOUNT_BASE64, APP_FIREBASE_SERVICE_ACCOUNT_JSON, or APP_FIREBASE_SERVICE_ACCOUNT_FILE"
          exit 1
        fi
      fi
    - |
      cat > toir-backend.env <<EOF
      SPRING_PROFILES_ACTIVE=prod
      APP_FIREBASE_ENABLED=${APP_FIREBASE_EFFECTIVE_ENABLED}
      APP_FIREBASE_PROJECT_ID=${APP_FIREBASE_EFFECTIVE_PROJECT_ID}
      APP_FIREBASE_SERVICE_ACCOUNT_BASE64=${APP_FIREBASE_EFFECTIVE_SERVICE_ACCOUNT_BASE64}
      APP_FIREBASE_SERVICE_ACCOUNT_JSON=
      APP_FIREBASE_SERVICE_ACCOUNT_FILE=
      EOF
    - ssh -i $SSH_PRIVATE_KEY -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SERVER_HOST "docker login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} --password ${CI_REGISTRY_PASSWORD}"
    - ssh -i $SSH_PRIVATE_KEY -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SERVER_HOST "docker pull ${CI_REGISTRY_IMAGE}:latest"
    - ssh -i $SSH_PRIVATE_KEY -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SERVER_HOST "docker stop ${SERVICE_NAME} || true"
    - ssh -i $SSH_PRIVATE_KEY -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SERVER_HOST "docker rm ${SERVICE_NAME} || true"
    - scp -i $SSH_PRIVATE_KEY -o StrictHostKeyChecking=no -P $SSH_PORT toir-backend.env $SSH_USER@$SERVER_HOST:/tmp/toir-backend.env
    - rm -f toir-backend.env
    - |
      RUN_STATUS=0
      ssh -i $SSH_PRIVATE_KEY -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SERVER_HOST "docker run -d --name ${SERVICE_NAME} --restart unless-stopped --env-file /tmp/toir-backend.env -p 10260:8080 ${CI_REGISTRY_IMAGE}:latest" || RUN_STATUS=$?
      ssh -i $SSH_PRIVATE_KEY -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SERVER_HOST "rm -f /tmp/toir-backend.env"
      exit $RUN_STATUS
